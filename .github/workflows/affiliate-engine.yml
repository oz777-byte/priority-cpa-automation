name: affiliate-engine

on:
  push:
    paths:
      - 'affiliate-engine/code/**'
      - '.github/workflows/affiliate-engine.yml'
  pull_request:
    paths:
      - 'affiliate-engine/code/**'
      - '.github/workflows/affiliate-engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiliate-engine/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Builds the full static storefront, which is the only thing that
      # catches a page that renders in dev and throws during export.
      - run: npm run build:storefront
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
